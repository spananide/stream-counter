services:
  kamerazeit:
    build:
      context: ..
      dockerfile: pi/Dockerfile
    restart: unless-stopped
    mem_limit: 400m
    volumes:
      - ..:/repo
      - ./ssh:/root/.ssh:ro
    environment:
      - STREAM_URL
      - KUMA_URL=${KUMA_URL:-}
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
      - TZ=Europe/Berlin
      - GIT_AUTHOR_NAME=kamerazeit
      - GIT_AUTHOR_EMAIL=kamerazeit@users.noreply.github.com
      - GIT_COMMITTER_NAME=kamerazeit
      - GIT_COMMITTER_EMAIL=kamerazeit@users.noreply.github.com
